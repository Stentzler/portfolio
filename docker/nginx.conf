server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # GitHub Actions verifies this path from inside the loopback-bound container.
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Next static export emits clean routes as .html files, for example
  # /projects.html for the public /projects URL.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
